name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # the release the bug was reported against, and the branch that fixes it
  XMAKE_VERSION: "3.1.1"
  FIX_REPO: xflcx1991/xmake
  FIX_BRANCH: fix-cl-c5072

# -----------------------------------------------------------------------------
# Six jobs: three platforms x {original, fixed}.
#
#   *-original  installs the official xmake release through
#               xmake-io/github-action-setup-xmake, then asserts that the
#               UNPATCHED oracle is the one in os.programdir().
#   *-fixed     builds xmake from the fix branch, then asserts that the PATCHED
#               oracle is the one in os.programdir().
#
# Nothing patches an installed xmake in place any more, so every job tests
# exactly one xmake and the job name says which one.
#
# Only Windows shows a difference between the two, because that is where the bug
# lives. The two ubuntu jobs and the two macos jobs are regression controls:
# both are expected to pass, before and after. They prove the fix does not
# disturb toolchains that never had the problem.
# -----------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------------------
  # Windows / MSVC, the original xmake -- the platform where the bug actually
  # bites, proven here against the runner's REAL cl.exe (no stub, no PATH
  # tricks: xmake resolves cl through the cached VS environment to an absolute
  # path, so shadowing could never work anyway -- and it is not needed):
  #
  #   <src> : warning C5072: ASAN enabled without debug information emission.
  #           Enable debug info for better ASAN error reporting
  #
  # cl prints that and still exits 0 whenever /fsanitize=address is on the
  # command line WITHOUT a debug-info flag (-Zi/-ZI/-Z7), whether or not the
  # asan runtime component is installed. xmake's own probe
  # (cl -c -nologo <flags> -Fo<o> <src>) has exactly that shape, so the original
  # 3.1.1 mistakes the warning for "flag unsupported". The seven flag checks are
  # the proof; the E2E step is a measurement (see its comment for why the
  # language flag survives a plain project build).
  #
  # The ground-truth probes live here rather than in the `fixed` job: they
  # measure cl.exe, not xmake, and both jobs run the same runner image. They
  # cost tens of milliseconds now; the step used to cost 45 minutes because of
  # how it waited, not because of what it ran (see the step itself).
  # ---------------------------------------------------------------------------
  windows-msvc-original:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: 'Assert this is the original xmake ${{ env.XMAKE_VERSION }}'
        shell: pwsh
        run: |
          # setup-xmake's getInstallerUrl only core.warning()s when an asset
          # 404s and then downgrades to the previous version, so the version has
          # to be checked rather than trusted.
          $ver = (xmake --version | Select-Object -First 1)
          Write-Host "xmake: $ver"
          if ($ver -notmatch [regex]::Escape($env:XMAKE_VERSION)) {
            Write-Host "VERDICT: this is not xmake $env:XMAKE_VERSION"
            exit 1
          }
          $env:EXPECT_MODE = 'original'
          xmake l check/import_module.lua

      - name: Locate toolchain
        shell: pwsh
        run: |
          $cl = (Get-Command cl.exe).Source
          Write-Host "cl: $cl"
          Add-Content $env:GITHUB_ENV "CL_PROGRAM=$cl"
          $clangcl = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if ($clangcl) {
            Write-Host "clang-cl: $($clangcl.Source)"
            Add-Content $env:GITHUB_ENV "CLANG_CL_PROGRAM=$($clangcl.Source)"
          } else {
            Write-Host "clang-cl: not on PATH, that check will be skipped"
          }

      - name: 'Ground truth: measure the real cl (no assertions)'
        shell: pwsh
        run: |
          # Everything else assumes the shape of cl's answer; this is where we
          # actually find out what it is instead of trusting a guess.
          $cl = $env:CL_PROGRAM
          Set-Content -Path probe.c -Value 'int main(void){return 0;}' -Encoding ascii

          # Why this waits the way it does. `cl 2>&1` under
          # $ErrorActionPreference='stop' throws a NativeCommandError in GitHub
          # Actions, so the output goes to files -- but Start-Process -Wait with
          # file redirection costs 900 s PER PROBE here, 45 minutes for three,
          # with cl having written its answer and exited long before that.
          # Measured on this image (runner 2.337.0 / image 20260901.588):
          #
          #   -Wait inline in the step's own pwsh   never returned (run 37269078391,
          #                                         cancelled at timeout-minutes: 3;
          #                                         and run 37248020220, 900 s x3)
          #   -Wait in a pwsh this step spawns      134 ms      (run 37268791353)
          #   -PassThru + WaitForExit(ms) inline     38-256 ms   (run 37268371898)
          #   the same cl.exe, launched by xmake     ms           (the flag check below)
          #
          # So the stall belongs to -Wait in this process context, not to cl --
          # and /xx, which fails instantly, stalls exactly as long as the compile
          # probes, which is what rules cl out. -Wait also has no timeout
          # parameter, so a wait that never observes the exit costs whatever it
          # costs. Polling WaitForExit with a deadline is the same wait, bounded,
          # and announcing the call first means a stall says which probe it is at.
          $capMs = 60000
          $probes = @(
            @{ name = 'A: /fsanitize=address, no debug info (xmake''s probe shape)';
               args = @('/nologo','/c','/fsanitize=address',"/Fo$env:RUNNER_TEMP\gt_a.obj",'probe.c') },
            @{ name = 'B: same plus /Zi (a debug-mode target''s shape)';
               args = @('/nologo','/c','/Zi','/fsanitize=address',"/Fo$env:RUNNER_TEMP\gt_b.obj",'probe.c') },
            @{ name = 'C: unknown option /xx (what D9002 looks like here)';
               args = @('/nologo','/c','/xx',"/Fo$env:RUNNER_TEMP\gt_c.obj",'probe.c') },
            # /options:strict makes cl EXIT NON-ZERO on an unrecognized option
            # (error D8043) instead of warning D9002 + exit 0. If that holds on
            # this toolset, "unsupported" stops being a text-parsing question and
            # can be an exit-code one -- which is what has_flags should use.
            #
            # /W5 is the case that tests whether "unrecognized option" is really
            # the only failure mode: here the option IS recognized and only its
            # value is bad (cl: warning D9014, "invalid value for /W; assuming 1"),
            # so D8043 and D9002 alone cannot cover the invalid-argument family.
            @{ name = 'D: /W5, recognized option with an invalid value';
               args = @('/nologo','/c','/W5',"/Fo$env:RUNNER_TEMP\gt_d.obj",'probe.c') },
            @{ name = 'E: /options:strict + /W5 (does strict cover bad values?)';
               args = @('/nologo','/c','/options:strict','/W5',"/Fo$env:RUNNER_TEMP\gt_e.obj",'probe.c') },
            @{ name = 'F: /options:strict + /xx (expect D8043 and a non-zero exit)';
               args = @('/nologo','/c','/options:strict','/xx',"/Fo$env:RUNNER_TEMP\gt_f.obj",'probe.c') },
            @{ name = 'G: /options:strict + /fsanitize=address (must still exit 0, C5072 stays a warning)';
               args = @('/nologo','/c','/options:strict','/fsanitize=address',"/Fo$env:RUNNER_TEMP\gt_g.obj",'probe.c') },
            @{ name = 'H: /options:strict + /W4 /W3 (accepted-but-overridden: D9025 under strict?)';
               args = @('/nologo','/c','/options:strict','/W4','/W3',"/Fo$env:RUNNER_TEMP\gt_h.obj",'probe.c') },
            # D/E showed strict only reaches unrecognized OPTIONS, so /W5 stays
            # exit 0 + D9014 either way. "Invalid value" is its own family with its
            # own codes (D9014, D9025, D9041, D8021) and per the design decision
            # those count as SUPPORTED: cl carried on and produced an object file.
            #
            # I is the shape of the one-time capability probe a fix needs, because
            # /options:strict is VS 2022 17.0+ only and cl/has_flags.lua is inherited
            # by icl and ifort, where its behavior is undocumented: on a driver that
            # does not know it, the flag must be dropped rather than left in the
            # probe line. Whether such a driver warns (exit 0) or errors (exit != 0)
            # on an unrecognized option is the difference between a harmless
            # addition and one that answers "unsupported" for every flag there is.
            #
            # J is the leak's own shape: -fsanitize=address is what arrives in
            # sysflags, and C5072 is the answer that has to be read as "supported".
            # K asks whether the edition-lacks-the-feature family (D9040, "ignoring
            # '/analyze'") is worth failing on -- and the same command line twice is
            # how you find out whether a diagnostic repeats per invocation or per
            # option.
            @{ name = 'I: /options:strict alone (the capability probe''s own command line)';
               args = @('/nologo','/c','/options:strict',"/Fo$env:RUNNER_TEMP\gt_i.obj",'probe.c') },
            @{ name = 'J: /fsanitize=address again (is C5072 per call or per option?)';
               args = @('/nologo','/c','/fsanitize=address',"/Fo$env:RUNNER_TEMP\gt_j.obj",'probe.c') },
            @{ name = 'K: /analyze (does this edition answer D9040?)';
               args = @('/nologo','/c','/analyze',"/Fo$env:RUNNER_TEMP\gt_k.obj",'probe.c') }
          )
          foreach ($probe in $probes) {
            $out = "$env:RUNNER_TEMP\gt.out"
            $err = "$env:RUNNER_TEMP\gt.err"
            Remove-Item $out,$err -ErrorAction SilentlyContinue
            Write-Host "=== $($probe.name)"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $cl -ArgumentList $probe.args -NoNewWindow -PassThru `
                  -RedirectStandardOutput $out -RedirectStandardError $err
            $exited = $false
            while ($sw.ElapsedMilliseconds -lt $capMs) {
              if ($p.WaitForExit(200)) { $exited = $true; break }
            }
            $sw.Stop()
            if (-not $exited) {
              Write-Host "TIMEOUT: still running at the ${capMs} ms cap, killing it"
              try { $p.Kill($true); $p.WaitForExit(5000) | Out-Null } catch {}
            }
            # ExitCode is only trustworthy once the exit was actually observed.
            $code = if ($exited) { $p.ExitCode } else { 'n/a (killed at the cap)' }
            Write-Host "exit: $code  after $($sw.ElapsedMilliseconds) ms"
            Write-Host "stdout (this is what xmake parses):"
            Get-Content $out | ForEach-Object { Write-Host "  |$_" }
            $errlines = Get-Content $err -ErrorAction SilentlyContinue
            if ($errlines) {
              Write-Host "stderr (xmake does not parse this for cl):"
              $errlines | ForEach-Object { Write-Host "  |$_" }
            }
          }

          # Can a fix learn about /options:strict for free, from the `cl -?` option
          # list that _check_from_arglist() already fetches and caches? Two things
          # have to hold: -? has to print it, and it has to survive the parser there,
          # which tokenizes with (/[%-%a%d]+)\s+ and so stops at ':' -- it would read
          # '/options' plus 'strict' and never key on 'options:strict'.
          #
          # The exit code is measured too, because _check_from_arglist calls
          # vstool.iorunv for it and that wrapper raises on a non-zero exit.
          $qout = "$env:RUNNER_TEMP\q.out"
          $qerr = "$env:RUNNER_TEMP\q.err"
          Remove-Item $qout,$qerr -ErrorAction SilentlyContinue
          Write-Host "=== L: cl -? (the option list xmake already caches)"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $cl -ArgumentList @('-?') -NoNewWindow -PassThru `
                -RedirectStandardOutput $qout -RedirectStandardError $qerr
          $exited = $false
          while ($sw.ElapsedMilliseconds -lt $capMs) {
            if ($p.WaitForExit(200)) { $exited = $true; break }
          }
          $sw.Stop()
          if (-not $exited) {
            Write-Host "TIMEOUT: still running at the ${capMs} ms cap, killing it"
            try { $p.Kill($true); $p.WaitForExit(5000) | Out-Null } catch {}
          }
          Write-Host "exit: $(if ($exited) { $p.ExitCode } else { 'n/a (killed at the cap)' }) after $($sw.ElapsedMilliseconds) ms"
          Write-Host "lines: $((Get-Content $qout).Count)"
          foreach ($needle in @('options:strict', 'fsanitize', 'analyze')) {
            $hits = Select-String -Path $qout -Pattern $needle -SimpleMatch -ErrorAction SilentlyContinue
            if ($hits) {
              Write-Host "'$needle' is listed:"
              $hits | ForEach-Object { Write-Host "  |$($_.Line.Trim())" }
            } else {
              Write-Host "'$needle' NOT in the -? output"
            }
          }

          # for the record: is the asan runtime even installed on this runner?
          $asanlib = $null
          foreach ($dir in ($env:LIB -split ';' | Where-Object { $_ })) {
            $hit = Get-ChildItem -Path $dir -Filter 'clang_rt.asan_dynamic-x86_64.lib' `
                   -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $asanlib = $hit.FullName; break }
          }
          if ($asanlib) {
            Write-Host "asan runtime: PRESENT ($asanlib)"
          } else {
            Write-Host "asan runtime: ABSENT from LIB"
          }
          exit 0

      - name: 'Streams xmake actually sees (measurement, no assertions)'
        shell: pwsh
        run: |
          # The step above is cl answering PowerShell. This is cl answering xmake's
          # own wrapper, private.tools.vstool.iorunv, which is the only stream
          # core.tools.cl.has_flags can read -- and it redirects diagnostics through
          # VS_UNICODE_OUTPUT rather than our stdout, so it is a different question.
          # Whether the D9002 / D8043 text even reaches outdata decides what a fix can
          # be written against, and no amount of reading the Lua says so.
          xmake l check/dump_vstool_output.lua
          exit 0

      - name: Flag check (expect the bug)
        shell: pwsh
        run: |
          $env:EXPECT_MODE = 'original'
          xmake l check/check_has_flags.lua

      - name: 'E2E (measurement, no assertions)'
        shell: pwsh
        run: |
          # The flag checks above are the proof. This step only records what a
          # real build does. Measured on this runner: the set_languages probe
          # ("checking for flags (-std:c++20)") carries no asan sysflag, so
          # C5072 never fires there and the flag is kept in BOTH modes. The
          # flow reported in the wild -- package installs whose on_check passes
          # the toolchain flags along -- is what check case 3 (sysflags=asan)
          # models.
          foreach ($mode in @('release','debug')) {
            Push-Location repro
            xmake f -c -p windows -a x64 -m $mode
            $log = (xmake -v 2>&1 | Out-String)
            Pop-Location
            Write-Host "=== $mode mode, original xmake"
            Write-Host $log
            if ($log -match 'std:c\+\+20|std:c\+\+latest') {
              Write-Host "MEASURE ($mode): the c++20 flag reached the compiler"
            } else {
              Write-Host "MEASURE ($mode): the c++20 flag was dropped -- end-to-end repro of the reported breakage"
            }
          }
          exit 0

  # ---------------------------------------------------------------------------
  # Windows / MSVC, xmake built from the fix branch.
  #
  # The same seven flag checks and the same E2E build, one xmake later. Here they
  # are assertions rather than measurements: the c++20 flag must reach cl and
  # the build must be clean.
  # ---------------------------------------------------------------------------
  windows-msvc-fixed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # xmake's C core can only be compiled by an existing xmake, so the release
      # is installed purely as a bootstrap. Every later step invokes
      # $env:FIXED_XMAKE by absolute path and never the bare `xmake` on PATH, so
      # which of the two answers a check cannot be in doubt.
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIX_REPO }}
          ref: ${{ env.FIX_BRANCH }}
          submodules: recursive
          path: xmake-src

      - name: Build xmake from the fix branch
        shell: pwsh
        run: |
          Push-Location xmake-src
          git show --stat --oneline HEAD
          Pop-Location

          # xmake's own windows.yml recipe: build the C core in core/, then drop
          # the exe into the checkout's xmake/ module dir, where engine.c finds
          # it by looking for <exedir>/core/_xmake_main.lua.
          #
          # Deliberately NOT built with --embed=y: an embedded build unpacks its
          # modules into a tmpdir, so os.programdir() would point away from the
          # tree the fix lives in and the assertion below would check nothing.
          Push-Location xmake-src/core
          xmake f -c -y -a x64
          xmake
          Copy-Item build/xmake.exe ../xmake/xmake.exe
          Pop-Location

          $progdir = (Resolve-Path xmake-src/xmake).Path
          Write-Host "fixed xmake: $progdir\xmake.exe"
          Add-Content $env:GITHUB_ENV "FIXED_XMAKE=$progdir\xmake.exe"

      - name: Assert this is the fixed xmake
        shell: pwsh
        run: |
          & $env:FIXED_XMAKE --version
          $env:EXPECT_MODE = 'fixed'
          # the bootstrap release is installed in this job too, so pin which tree
          # os.programdir() actually resolved to
          $env:EXPECT_PROGRAMDIR = 'xmake-src'
          & $env:FIXED_XMAKE l check/import_module.lua

      - name: Locate toolchain
        shell: pwsh
        run: |
          $cl = (Get-Command cl.exe).Source
          Write-Host "cl: $cl"
          Add-Content $env:GITHUB_ENV "CL_PROGRAM=$cl"
          $clangcl = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if ($clangcl) {
            Write-Host "clang-cl: $($clangcl.Source)"
            Add-Content $env:GITHUB_ENV "CLANG_CL_PROGRAM=$($clangcl.Source)"
          } else {
            Write-Host "clang-cl: not on PATH, that check will be skipped"
          }

      - name: Flag check (expect support)
        shell: pwsh
        run: |
          $env:EXPECT_MODE = 'fixed'
          & $env:FIXED_XMAKE l check/check_has_flags.lua

      - name: 'Flag check, cold detect cache (expect support)'
        shell: pwsh
        run: |
          # The run above answers with whatever the driver capability gate found
          # in the global detect cache, and that cache outlives an xmake upgrade:
          # its key is the compiler path, with no xmake version in it. So an entry
          # written by an older xmake -- one that never recorded /options:strict --
          # reads back as "no gate", and the probe falls through to the D9002 text
          # scan. Both answers are correct, which is exactly why the seven rows
          # cannot tell them apart; the gate line the script prints can.
          #
          # This step deletes the cache and runs the same checks again, which is the
          # state a first run after a clean install is in. Nothing else changes: the
          # expectations are identical, because the fix has to hold in both regimes,
          # and the two runs together say which mechanism answered.
          #
          # $HOME/.xmake/cache/detect is one file, not a per-version directory, so
          # the bootstrap release installed in this job and the fixed build below it
          # read and write the same one. It is this runner's own scratch state,
          # regenerated on the next detection, and deleting it reaches nothing else.
          $detect = Join-Path $HOME '.xmake\cache\detect'
          if (Test-Path $detect) {
            $item = Get-Item $detect
            Write-Host ("clearing {0} ({1} bytes{2})" -f $item.FullName, $item.Length,
                        $(if ($item.PSIsContainer) { ', directory' } else { '' }))
            Remove-Item -Recurse -Force $detect
          } else {
            Write-Host "no detect cache at $detect -- the run above started cold too"
          }
          $env:EXPECT_MODE = 'fixed'
          & $env:FIXED_XMAKE l check/check_has_flags.lua

      - name: E2E release mode (expect the c++20 flag kept, clean build)
        shell: pwsh
        run: |
          Push-Location repro
          & $env:FIXED_XMAKE f -c -p windows -a x64 -m release
          $log = (& $env:FIXED_XMAKE -v 2>&1 | Out-String)
          Pop-Location
          Write-Host $log
          if ($log -notmatch 'std:c\+\+20|std:c\+\+latest') {
            Write-Host 'VERDICT: NO c++20 flag reached the compiler even with the fix'
            exit 1
          }
          if ($log -match 'error C\d+|error LNK\d+') {
            Write-Host 'VERDICT: the build still reported errors, see the log above'
            exit 1
          }
          Write-Host 'VERDICT: the c++20 flag reached the compiler and the build succeeded'

  # ---------------------------------------------------------------------------
  # Ubuntu, the original xmake.
  #
  # Control group: the very same project (c++20 + asan policy) builds cleanly
  # through gcc, which shows that the Windows breakage is xmake's MSVC flag
  # detection and not the project.
  #
  # Heads up: on Linux and macOS setup-xmake ALWAYS builds from source -- its
  # unix-install path runs ./configure && make && make install even for a tag --
  # so the install step takes a few minutes. That is the same cost the official
  # shget.text script had.
  # ---------------------------------------------------------------------------
  ubuntu-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: 'Assert this is the original xmake ${{ env.XMAKE_VERSION }}'
        run: |
          set -euo pipefail
          xmake --version
          xmake --version | head -1 | grep -qF "$XMAKE_VERSION"
          EXPECT_MODE=original xmake l check/import_module.lua

      - name: 'Control build (gcc): the project itself is healthy'
        run: |
          set -euo pipefail
          cd repro
          xmake f -c -y
          xmake -v 2>&1 | tee "$RUNNER_TEMP/build.log"
          # both the language flag and the sanitizer flag must reach gcc
          grep -q -- '-std=c++' "$RUNNER_TEMP/build.log"
          grep -q -- '-fsanitize=address' "$RUNNER_TEMP/build.log"

  # ---------------------------------------------------------------------------
  # Ubuntu, xmake built from the fix branch.
  #
  # Proves that the branch itself -- as committed to a real xmake checkout and
  # built per the development guide -- installs, really carries the fix, and
  # still builds normal projects. Building from the branch instead of patching a
  # file in place is what keeps the branch and the tested code from drifting
  # apart.
  # ---------------------------------------------------------------------------
  ubuntu-fixed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIX_REPO }}
          ref: ${{ env.FIX_BRANCH }}
          submodules: recursive
          path: xmake-src

      - name: Build and install xmake from the fix branch
        run: |
          set -euo pipefail
          cd xmake-src
          git show --stat --oneline HEAD
          ./configure
          make -j"$(nproc)"
          make install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "FIXED_XMAKE=$HOME/.local/bin/xmake" >> "$GITHUB_ENV"

      - name: Assert this is the fixed xmake
        run: |
          set -euo pipefail
          "$FIXED_XMAKE" --version
          EXPECT_MODE=fixed EXPECT_PROGRAMDIR="$HOME/.local" "$FIXED_XMAKE" l check/import_module.lua

      - name: 'Control build (gcc): unchanged by the fix'
        run: |
          set -euo pipefail
          cd repro
          "$FIXED_XMAKE" f -c -y
          "$FIXED_XMAKE" -v 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -q -- '-std=c++' "$RUNNER_TEMP/build.log"
          grep -q -- '-fsanitize=address' "$RUNNER_TEMP/build.log"

  # ---------------------------------------------------------------------------
  # macOS arm64, the original xmake. Same control build as ubuntu, on
  # AppleClang and arm64 hardware.
  # ---------------------------------------------------------------------------
  macos-arm64-original:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert arm64 hardware
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: 'Assert this is the original xmake ${{ env.XMAKE_VERSION }}'
        run: |
          set -euo pipefail
          xmake --version
          xmake --version | head -1 | grep -qF "$XMAKE_VERSION"
          EXPECT_MODE=original xmake l check/import_module.lua

      - name: 'Control build (AppleClang): the project itself is healthy'
        run: |
          set -euo pipefail
          cd repro
          xmake f -c -y
          xmake -v 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -q -- '-std=c++' "$RUNNER_TEMP/build.log"
          grep -q -- '-fsanitize=address' "$RUNNER_TEMP/build.log"

  # ---------------------------------------------------------------------------
  # macOS arm64, xmake built from the fix branch.
  # ---------------------------------------------------------------------------
  macos-arm64-fixed:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert arm64 hardware
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIX_REPO }}
          ref: ${{ env.FIX_BRANCH }}
          submodules: recursive
          path: xmake-src

      - name: Build and install xmake from the fix branch
        run: |
          set -euo pipefail
          cd xmake-src
          git show --stat --oneline HEAD
          ./configure
          make -j"$(sysctl -n hw.ncpu)"
          make install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "FIXED_XMAKE=$HOME/.local/bin/xmake" >> "$GITHUB_ENV"

      - name: Assert this is the fixed xmake
        run: |
          set -euo pipefail
          "$FIXED_XMAKE" --version
          EXPECT_MODE=fixed EXPECT_PROGRAMDIR="$HOME/.local" "$FIXED_XMAKE" l check/import_module.lua

      - name: 'Control build (AppleClang): unchanged by the fix'
        run: |
          set -euo pipefail
          cd repro
          "$FIXED_XMAKE" f -c -y
          "$FIXED_XMAKE" -v 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -q -- '-std=c++' "$RUNNER_TEMP/build.log"
          grep -q -- '-fsanitize=address' "$RUNNER_TEMP/build.log"
