name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  XMAKE_VERSION: "3.1.1"

jobs:
  # ---------------------------------------------------------------------------
  # Windows / MSVC -- the platform where the bug actually bites, proven here
  # against the runner's REAL cl.exe (no stub, no PATH tricks: xmake resolves
  # cl through the cached VS environment to an absolute path, so shadowing
  # could never work anyway -- and it is not needed):
  #
  #   <src> : warning C5072: ASAN enabled without debug information emission.
  #           Enable debug info for better ASAN error reporting
  #
  # cl prints that and still exits 0 whenever /fsanitize=address is on the
  # command line WITHOUT a debug-info flag (-Zi/-ZI/-Z7), whether or not the
  # asan runtime component is installed. xmake's own probe
  # (cl -c -nologo <flags> -Fo<o> <src>) has exactly that shape, so stock 3.1.1
  # mistakes the warning for "flag unsupported". The five flag checks are the
  # proof; the E2E steps are measurements (see the step comment for why the
  # language flag survives a plain project build).
  # ---------------------------------------------------------------------------
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install xmake ${{ env.XMAKE_VERSION }} (official script)
        shell: pwsh
        run: |
          $installdir = "$env:RUNNER_TEMP\xmake-$env:XMAKE_VERSION"
          # psget.text -> scripts/get.ps1 -> xmake-v3.1.1.win64.exe (silent NSIS install)
          # note: -version must NOT carry the leading 'v', the script does [version]::Parse()
          & ([ScriptBlock]::Create((irm https://xmake.io/psget.text))) -version $env:XMAKE_VERSION -installdir $installdir
          # get.ps1 only changes $env:Path for its own session, so re-export it
          Add-Content $env:GITHUB_PATH $installdir
          & "$installdir\xmake.exe" --version

      - name: Locate toolchain
        shell: pwsh
        run: |
          $cl = (Get-Command cl.exe).Source
          Write-Host "cl: $cl"
          Add-Content $env:GITHUB_ENV "CL_PROGRAM=$cl"
          $clangcl = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if ($clangcl) {
            Write-Host "clang-cl: $($clangcl.Source)"
            Add-Content $env:GITHUB_ENV "CLANG_CL_PROGRAM=$($clangcl.Source)"
          } else {
            Write-Host "clang-cl: not on PATH, that check will be skipped"
          }
          Add-Content $env:GITHUB_ENV "FIXED_LUA=$env:GITHUB_WORKSPACE\patches\cl_has_flags.fixed.lua"

      - name: 'Ground truth: measure the real cl (no assertions)'
        shell: pwsh
        run: |
          # Everything below assumes the shape of cl's answer; this is where we
          # actually find out what it is instead of trusting a guess.
          $cl = $env:CL_PROGRAM
          Set-Content -Path probe.c -Value 'int main(void){return 0;}' -Encoding ascii

          # `cl 2>&1` under $ErrorActionPreference='stop' throws a
          # NativeCommandError in GitHub Actions, so go through Start-Process
          # with redirected streams instead.
          $probes = @(
            @{ name = 'A: /fsanitize=address, no debug info (xmake''s probe shape)';
               args = @('/nologo','/c','/fsanitize=address',"/Fo$env:RUNNER_TEMP\gt_a.obj",'probe.c') },
            @{ name = 'B: same plus /Zi (a debug-mode target''s shape)';
               args = @('/nologo','/c','/Zi','/fsanitize=address',"/Fo$env:RUNNER_TEMP\gt_b.obj",'probe.c') },
            @{ name = 'C: unknown option /xx (what D9002 looks like here)';
               args = @('/nologo','/c','/xx',"/Fo$env:RUNNER_TEMP\gt_c.obj",'probe.c') }
          )
          foreach ($probe in $probes) {
            $out = "$env:RUNNER_TEMP\gt.out"
            $err = "$env:RUNNER_TEMP\gt.err"
            Remove-Item $out,$err -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $cl -ArgumentList $probe.args -NoNewWindow -Wait -PassThru `
                  -RedirectStandardOutput $out -RedirectStandardError $err
            Write-Host "=== $($probe.name)"
            Write-Host "exit: $($p.ExitCode)"
            Write-Host "stdout (this is what xmake parses):"
            Get-Content $out | ForEach-Object { Write-Host "  |$_" }
            $errlines = Get-Content $err -ErrorAction SilentlyContinue
            if ($errlines) {
              Write-Host "stderr (xmake does not parse this for cl):"
              $errlines | ForEach-Object { Write-Host "  |$_" }
            }
          }

          # for the record: is the asan runtime even installed on this runner?
          $asanlib = $null
          foreach ($dir in ($env:LIB -split ';' | Where-Object { $_ })) {
            $hit = Get-ChildItem -Path $dir -Filter 'clang_rt.asan_dynamic-x86_64.lib' `
                   -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $asanlib = $hit.FullName; break }
          }
          if ($asanlib) {
            Write-Host "asan runtime: PRESENT ($asanlib)"
          } else {
            Write-Host "asan runtime: ABSENT from LIB"
          }
          exit 0

      - name: Flag check, stock xmake (expect the bug)
        shell: pwsh
        run: |
          $env:EXPECT_MODE = 'bug'
          xmake l check/check_has_flags.lua

      - name: 'E2E, stock xmake (measurement, no assertions)'
        shell: pwsh
        run: |
          # The flag checks above are the proof. This step only records what a
          # real build does. Measured on this runner: the set_languages probe
          # ("checking for flags (-std:c++20)") carries no asan sysflag, so
          # C5072 never fires there and the flag is kept in BOTH modes. The
          # flow reported in the wild -- package installs whose on_check passes
          # the toolchain flags along -- is what check case 3 (sysflags=asan)
          # models.
          foreach ($mode in @('release','debug')) {
            Push-Location repro
            xmake f -c -p windows -a x64 -m $mode
            $log = (xmake -v 2>&1 | Out-String)
            Pop-Location
            Write-Host "=== $mode mode, stock xmake"
            Write-Host $log
            if ($log -match 'std:c\+\+20|std:c\+\+latest') {
              Write-Host "MEASURE ($mode): the c++20 flag reached the compiler"
            } else {
              Write-Host "MEASURE ($mode): the c++20 flag was dropped -- end-to-end repro of the reported breakage"
            }
          }
          exit 0

      - name: Apply patches/cl_has_flags.fixed.lua over os.programdir()
        shell: pwsh
        run: xmake l check/apply_fix.lua

      - name: Flag check, with the fix (expect support)
        shell: pwsh
        run: |
          $env:EXPECT_MODE = 'fixed'
          xmake l check/check_has_flags.lua

      - name: E2E release mode, with the fix (expect the c++20 flag kept, clean build)
        shell: pwsh
        run: |
          Push-Location repro
          xmake f -c -p windows -a x64 -m release
          $log = (xmake -v 2>&1 | Out-String)
          Pop-Location
          Write-Host $log
          if ($log -notmatch 'std:c\+\+20|std:c\+\+latest') {
            Write-Host 'VERDICT: NO c++20 flag reached the compiler even with the fix'
            exit 1
          }
          if ($log -match 'error C\d+|error LNK\d+') {
            Write-Host 'VERDICT: the build still reported errors, see the log above'
            exit 1
          }
          Write-Host 'VERDICT: the c++20 flag reached the compiler and the build succeeded'

  # ---------------------------------------------------------------------------
  # Ubuntu, stock xmake installed by the official script.
  #
  # Control group + fix safety, no stub involved:
  #   * the very same project (c++20 + asan policy) builds cleanly through gcc,
  #     which shows the Windows breakage is xmake's MSVC flag detection, not
  #     the project;
  #   * after the fix is applied over os.programdir(), the patched module still
  #     imports and normal builds are unaffected on POSIX.
  #
  # (The original stub-driven flag checks are gone: the Windows job proves the
  # bug against the real cl.exe, which is strictly stronger.)
  #
  # Heads up: scripts/get.sh ALWAYS builds from source. With a tag argument it
  # does `git clone --depth=1 -b v3.1.1 --recurse-submodules` followed by
  # ./configure && make -j && make install, so this job takes a few minutes.
  # Its gitrepo is hardcoded to xmake-io/xmake.git, which is why it cannot be
  # used to install the fork below.
  # ---------------------------------------------------------------------------
  ubuntu-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake v${{ env.XMAKE_VERSION }} from source (official script)
        run: |
          curl -fsSL https://xmake.io/shget.text | bash -s "v$XMAKE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xmake" --version

      - name: 'Control build (gcc): the project itself is healthy'
        run: |
          cd repro
          xmake f -c -y
          set -o pipefail
          xmake -v 2>&1 | tee "$RUNNER_TEMP/build.log"
          # both the language flag and the sanitizer flag must reach gcc
          grep -q -- '-std=c++' "$RUNNER_TEMP/build.log"
          grep -q -- '-fsanitize=address' "$RUNNER_TEMP/build.log"

      - name: Apply patches/cl_has_flags.fixed.lua over os.programdir()
        env:
          FIXED_LUA: ${{ github.workspace }}/patches/cl_has_flags.fixed.lua
        run: xmake l check/apply_fix.lua

      - name: Import smoke and rebuild with the fix in place
        run: |
          # a gcc build never loads core/tools/cl/has_flags.lua; importing it
          # forces the patched file to at least parse and load
          xmake l check/import_module.lua
          cd repro
          xmake f -c -y
          xmake

  # ---------------------------------------------------------------------------
  # Ubuntu, xmake built from the fix branch of the fork.
  #
  # Proves the branch itself -- as committed to a real xmake checkout and built
  # per the development guide -- installs, really carries the fix, and still
  # builds normal projects, so the patch file cannot have drifted from the
  # branch.
  # ---------------------------------------------------------------------------
  ubuntu-fork-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: xflcx1991/xmake
          ref: fix-cl-c5072
          submodules: recursive
          path: xmake-src

      - name: Build and install xmake from the fix branch
        run: |
          cd xmake-src
          git show --stat --oneline HEAD
          ./configure
          make -j"$(nproc)"
          make install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xmake" --version

      - name: Confirm the branch really carries the fix
        run: grep -n 'D%d%d%d%d' "$HOME/.local/share/xmake/modules/core/tools/cl/has_flags.lua"

      - name: Control build from the fix branch (gcc)
        run: |
          cd repro
          xmake f -c -y
          set -o pipefail
          xmake -v 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -q -- '-std=c++' "$RUNNER_TEMP/build.log"
          grep -q -- '-fsanitize=address' "$RUNNER_TEMP/build.log"

  # ---------------------------------------------------------------------------
  # macOS arm64, stock xmake from the official script.
  #
  # Same control build + fix safety as ubuntu-stock, on AppleClang.
  # ---------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert arm64 hardware
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install xmake v${{ env.XMAKE_VERSION }} from source (official script)
        run: |
          curl -fsSL https://xmake.io/shget.text | bash -s "v$XMAKE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xmake" --version

      - name: 'Control build (AppleClang): the project itself is healthy'
        run: |
          cd repro
          xmake f -c -y
          set -o pipefail
          xmake -v 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -q -- '-std=c++' "$RUNNER_TEMP/build.log"
          grep -q -- '-fsanitize=address' "$RUNNER_TEMP/build.log"

      - name: Apply patches/cl_has_flags.fixed.lua over os.programdir()
        env:
          FIXED_LUA: ${{ github.workspace }}/patches/cl_has_flags.fixed.lua
        run: xmake l check/apply_fix.lua

      - name: Import smoke and rebuild with the fix in place
        run: |
          xmake l check/import_module.lua
          cd repro
          xmake f -c -y
          xmake
