name: diag-cl-launch

# Throwaway job. ci.yml's ground-truth step costs 3 x ~900 s, one 15-minute
# stall per cl probe. Run 1 (37268371898) replayed those call shapes in a job
# with no xmake in it and everything came back in under 300 ms -- no
# reproduction. The one thing that job did not have is the slow job's history:
# there, setup-xmake and `xmake l` had already run before the slow step.
#
# So this job runs the same probes twice, before and after xmake has run in the
# same job. Same binary, same runner image, same step shell -- only the history
# differs, so any timing difference belongs to the history. Every wait is capped
# (diag/harness.ps1), worst case a few minutes.

on:
  workflow_dispatch:
  # workflow_dispatch only lists workflows found on the default branch, so this
  # branch starts its own job by push. ci.yml is not in this branch's tree,
  # which is why the 45-minute suite does not come along.
  push:
    branches:
      - diag-cl-launch

env:
  XMAKE_VERSION: "3.1.1"

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: 'Phase before, no xmake has run in this job yet'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File diag/harness.ps1 before

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      # The step that precedes the slow one in ci.yml, unchanged: this is what
      # could leave something behind.
      - name: 'xmake l check/import_module.lua, as ci.yml runs it'
        shell: pwsh
        run: |
          $env:EXPECT_MODE = 'original'
          xmake --version
          xmake l check/import_module.lua

      - name: 'Locate toolchain, as ci.yml step 6 writes it'
        shell: pwsh
        run: |
          $cl = (Get-Command cl.exe).Source
          Write-Host "cl: $cl"
          Add-Content $env:GITHUB_ENV "CL_PROGRAM=$cl"

      - name: 'Phase after, same probes with xmake already having run'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File diag/harness.ps1 after
